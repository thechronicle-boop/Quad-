name: Update Quad data

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 on the 1st of every month
  workflow_dispatch: {}     # lets you run it any time from the Actions tab
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/**", "source/**"]   # also runs when the checker is updated or a new Discover Uni zip is uploaded to source/

permissions:
  contents: write

concurrency:
  group: update-quad-data
  cancel-in-progress: false   # never run two checks at once

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import the official Discover Uni dataset (if a new zip was uploaded to source/)
        run: |
          if ls source/*.zip >/dev/null 2>&1; then python3 tools/import-discover-uni.py; cp data/discover-uni.json "$RUNNER_TEMP/discover-uni.json"; fi
      - name: Collect halls prices from uni websites
        run: node tools/collect-halls.mjs
      - name: Build quad-data.json and save
        run: |
          # keep the fresh results, then line up with the latest version on GitHub so saving can't clash
          cp data/halls.json "$RUNNER_TEMP/halls.json"
          cp data/halls-review.md "$RUNNER_TEMP/halls-review.md"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp "$RUNNER_TEMP/halls.json" data/halls.json
          cp "$RUNNER_TEMP/halls-review.md" data/halls-review.md
          if [ -f "$RUNNER_TEMP/discover-uni.json" ]; then cp "$RUNNER_TEMP/discover-uni.json" data/discover-uni.json; git rm -q --cached source/*.zip 2>/dev/null || true; rm -f source/*.zip; fi
          node tools/build-data.mjs
          git config user.name "quad-bot"
          git config user.email "quad-bot@users.noreply.github.com"
          git add -A quad-data.json quad-data.js variants/ data/ source/
          git diff --cached --quiet && exit 0
          git commit -m "Update data $(date +%F)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs origin main || true; sleep 5; done
          exit 1
